name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # 20 is the floor the README promises; 22 is what development runs on.
      matrix:
        node: ["20", "22"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      # `next typegen` first: LayoutProps and the other route types are generated
      # into .next/types, so a bare `tsc --noEmit` on a fresh checkout fails on
      # types that do not exist yet.
      - run: npm run typecheck
      - run: npm run build
      # Cheapest first: pure crypto, and it is the one suite that checks we
      # interoperate with something other than ourselves.
      - run: npm run test:sdjwt
      - run: npm run test:flow
      - run: npm run test:mcp
      - run: npm run test:agent
      - run: npm run test:docs
      - run: npm run test:race
      # The rehearsal drives the real HTTP surface, so it needs the built app
      # running. Added to CI without this it failed with ECONNREFUSED — green
      # locally only because a dev server happened to be up. Server and test share
      # one step so the process cannot outlive or be orphaned by the job.
      - name: Rehearsal against the built app
        env:
          GRANTONCE_STORE: /tmp/grantonce-rehearsal.json
        run: |
          npm run start &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          for _ in $(seq 1 60); do
            curl -sf http://localhost:43127/api/state >/dev/null && break
            sleep 1
          done
          curl -sf http://localhost:43127/api/state >/dev/null || {
            echo "app did not come up on :43127" >&2
            exit 1
          }
          npm run test:rehearsal

  # The suites above only prove themselves if removing a defence turns one red.
  # Kept as its own job: it runs every suite once per injected bug, so it is the
  # slow one, and a failure here means the tests have stopped covering something.
  mutation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run test:mutate
